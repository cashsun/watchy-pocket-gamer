; PlatformIO project config for building Watchy example sketches.
;
; Default env builds the StarField watchface (examples/WatchFaces/StarField),
; which is the face pre-flashed on the hardware. To build a different example,
; change `src_dir` in [platformio] or add another [env:*] section.
;
;   pio run                 # compile
;   pio run -t upload       # flash (put watch in bootloader: hold BACK+UP 4s,
;                           #        release BACK first)
;   pio run -t clean

[platformio]
src_dir = examples/WatchFaces/StarField

[env:watchy_v3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Watchy V3 (ESP32-S3, 32kHz crystal RTC). The library keys hardware revision
; off ARDUINO_ESP32S3_DEV, which this board defines.
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; The Watchy core library is this repository itself (has library.json at root).
; Point PlatformIO at the repo root so it resolves as a library; its own
; `depends` pull GxEPD2 / Adafruit GFX / Arduino_JSON / DS3232RTC / NTPClient /
; Rtc_Pcf8563 / WiFiManager automatically.
lib_deps =
	file://.
	; Watchy uses the pre-1.0.2 API (`Rtc_Pcf8563 rtc_pcf;`, no-arg ctor).
	; Newer commits switched to `Rtc_Pcf8563(WireBase&)`, which needs a type the
	; ESP32 Arduino core does not provide. Pin to the last commit before that.
	https://github.com/orbitalair/Rtc_Pcf8563.git#f29e884

lib_ldf_mode = deep+
